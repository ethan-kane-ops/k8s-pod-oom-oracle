site_name: OOM Oracle
site_description: Kubernetes node agent that explains OOM kills at the process level
site_author: Ethan Kane
site_url: https://ethan-kane-ops.github.io/k8s-pod-oom-oracle/

repo_name: ethan-kane-ops/k8s-pod-oom-oracle
repo_url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
edit_uri: edit/main/docs/

copyright: Apache License 2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Detectors: detectors.md
  - Correlation: correlation.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Guides:
      - Diagnose a Multi-Process Container: guides/multi-process.md
      - Run Without BTF: guides/no-btf.md
      - Gate a Pipeline on a Report: guides/ci-gate.md
  - Troubleshooting: troubleshooting.md
  - Security: security.md
  - Development: development.md
  - API Reference: reference/api.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
