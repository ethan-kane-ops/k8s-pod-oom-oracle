version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
      settings:
        # sampler.Sample is roughly 190 bytes of plain numbers and is passed by
        # value on purpose: it is an immutable reading copied into a ring buffer
        # once per second per cgroup, so the copy is not worth the aliasing risk
        # that pointers would introduce. Hot loops that iterate samples index
        # explicitly rather than ranging by value.
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test files may use fixtures with hardcoded paths and skip some rigour.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # The copy thresholds above are sized for the sampler's per-second hot
      # path. The e2e suite passes a decoded JSON report around a handful of
      # times per run, so a pointer there would be churn in service of a budget
      # that does not apply to it.
      - path: test/e2e/.*\.go
        text: "(hugeParam|rangeValCopy)"
        linters:
          - gocritic
      # bpf2go output is machine-generated and not ours to style.
      - path: internal/detector/bpf/.*_bpf.*\.go
        linters:
          - revive
          - gocritic
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ethan-kane-ops/k8s-pod-oom-oracle
