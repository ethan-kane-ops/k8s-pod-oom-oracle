version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
      settings:
        hugeParam:
          # Small immutable value structs stay value receivers; 80 bytes is a
          # handful of strings and copying them is cheaper than the indirection.
          sizeThreshold: 128

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test files may use fixtures with hardcoded paths and skip some rigour.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # bpf2go output is machine-generated and not ours to style.
      - path: internal/detector/bpf/.*_bpf.*\.go
        linters:
          - revive
          - gocritic
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ethan-kane-ops/k8s-pod-oom-oracle
