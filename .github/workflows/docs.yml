name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        # --require-hashes: requirements.txt is fully hash-pinned
        # (uv pip compile --generate-hashes docs/requirements.in)
        run: pip install --require-hashes -r docs/requirements.txt

      # --strict turns a broken internal link into a failure. The nav is the
      # only index of these pages, so a silently dead link is a page nobody
      # reaches.
      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    runs-on: ubuntu-latest
    needs: [build]
    # PAGES_ENABLED gates the deploy because Pages is not configured on this
    # repository yet, and a deploy against an unconfigured Pages site fails the
    # job and reddens main. The repository is also still private, and a Pages
    # site would be publicly readable, so enabling it is part of the public
    # launch rather than something the docs build decides on its own.
    #
    # To turn it on: enable Pages with source "GitHub Actions", then set the
    # repository variable PAGES_ENABLED to true.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
