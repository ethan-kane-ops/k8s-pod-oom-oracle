name: Release

# Tag-driven. `just release` writes the changelog, tags and pushes; everything
# published comes from here, so a release is never assembled on a laptop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: binaries and release
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub Release and uploading archives to it.
      contents: write
      # The OIDC token cosign exchanges for a short-lived signing certificate.
      # Keyless signing means there is no private key to hold, rotate or leak.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the tag history to resolve the version, and a
          # shallow clone gives it a wrong one rather than an error.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          just: "false"

      # goreleaser shells out to syft to produce the SBOMs.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1

      # Release notes come from CHANGELOG.md, not from commit subjects. The
      # breaking changes are written there by hand because no commit subject can
      # say which JSON field a consumer has to rename, and this script fails the
      # release rather than publishing without them.
      - name: Extract release notes
        run: ./hack/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 nodes are common enough in Kubernetes that a single-arch image
      # would be a surprising thing to ship for a node agent.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8s-pod-oom-oracle
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1

      # Signed by digest, never by tag. A tag can be moved to point at a
      # different image; a digest cannot.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/k8s-pod-oom-oracle
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/k8s-pod-oom-oracle
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
