name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  # On demand, because otherwise the first run of this workflow is a push to
  # main. It was skipped on every invocation while the repository was private,
  # so it had never actually executed, and its debut would have been the
  # release commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL needs GitHub Advanced Security on a private repository, where this
    # job would fail every run. The guard kept it dormant until the repository
    # went public, and still holds if it ever goes private again. A missing
    # visibility field evaluates false, which is the safe direction.
    #
    # This is the advanced setup. GitHub's *default* CodeQL setup must stay off:
    # with it enabled the SARIF upload below is rejected and this workflow fails.
    # Public repositories can have it switched on for them, so if code scanning
    # starts failing, check Settings, Code security, Code scanning first.
    if: github.event.repository.visibility == 'public'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - uses: ./.github/actions/setup
        with:
          just: "false"

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
