apiVersion: v2
name: oom-oracle
description: Node agent that explains Kubernetes OOM kills at the process level, using eBPF and cgroups
type: application
# Kept in step with the git tag. The Release workflow refuses to publish when
# this and the tag disagree, because a chart whose version is not the version it
# installs is worse than no chart.
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
sources:
  - https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
keywords:
  - kubernetes
  - oom
  - oomkilled
  - ebpf
  - cgroups
  - observability
  - troubleshooting
  - sre
maintainers:
  - name: ethan-kane-ops
    url: https://github.com/ethan-kane-ops
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  # Listed so Artifact Hub can scan the image it actually installs. The tag
  # tracks appVersion above, and the Release workflow refuses to publish when
  # the two disagree with the git tag.
  artifacthub.io/images: |
    - name: oom-oracle
      image: ghcr.io/ethan-kane-ops/k8s-pod-oom-oracle:0.1.0
  # The agent needs host namespaces and two capabilities. Artifact Hub surfaces
  # this on the listing, which is the right place for someone to find out before
  # installing rather than after admission rejects it.
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
    - name: documentation
      url: https://ethan-kane-ops.github.io/k8s-pod-oom-oracle/
    - name: security
      url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle/blob/main/SECURITY.md
