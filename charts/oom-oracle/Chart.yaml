apiVersion: v2
name: oom-oracle
description: Node agent that explains Kubernetes OOM kills at the process level, using eBPF and cgroups
type: application
# Kept in step with the git tag. The Release workflow refuses to publish when
# this and the tag disagree, because a chart whose version is not the version it
# installs is worse than no chart.
version: 0.1.1
appVersion: "0.1.1"
# securityContext.seccompProfile went GA in 1.19 and the DaemonSet renders it
# unconditionally, so anything older installs a pod the API server rejects.
kubeVersion: ">=1.19.0-0"
home: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
sources:
  - https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
keywords:
  - kubernetes
  - oom
  - oomkilled
  - ebpf
  - cgroups
  - observability
  - troubleshooting
  - sre
maintainers:
  - name: ethan-kane-ops
    url: https://github.com/ethan-kane-ops
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  # Listed so Artifact Hub can scan the image it actually installs. The tag
  # tracks appVersion above, and the Release workflow refuses to publish when
  # the two disagree with the git tag.
  artifacthub.io/images: |
    - name: oom-oracle
      image: ghcr.io/ethan-kane-ops/k8s-pod-oom-oracle:0.1.1
  # The agent needs host namespaces and two capabilities. Artifact Hub surfaces
  # this on the listing, which is the right place for someone to find out before
  # installing rather than after admission rejects it.
  artifacthub.io/containsSecurityUpdates: "false"
  # Artifact Hub renders these as the release notes on the listing, and reports
  # "no changelog" without them. Every entry links to the release it describes,
  # which is also what hack/chart-version.sh checks: a block still pointing at
  # the previous tag fails the bump rather than publishing stale notes.
  artifacthub.io/changes: |
    - kind: fixed
      description: Release archives and their cosign signatures are published again; v0.1.0 shipped the image and chart but neither of those
      links:
        - name: Release notes
          url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle/releases/tag/v0.1.1
    - kind: changed
      description: Signatures are verified from a single cosign bundle instead of a detached .sig and certificate
      links:
        - name: Release notes
          url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle/releases/tag/v0.1.1
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle
    - name: documentation
      url: https://ethan-kane-ops.github.io/k8s-pod-oom-oracle/
    - name: security
      url: https://github.com/ethan-kane-ops/k8s-pod-oom-oracle/blob/main/SECURITY.md
