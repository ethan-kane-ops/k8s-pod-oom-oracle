apiVersion: v1
kind: Namespace
metadata:
  name: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
    # The agent is privileged by necessity: it loads a BPF program and reads the
    # node's cgroups and processes. Pod Security must be told so, or admission
    # rejects the DaemonSet outright.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
