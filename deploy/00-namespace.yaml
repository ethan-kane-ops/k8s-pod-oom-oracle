apiVersion: v1
kind: Namespace
metadata:
  name: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
    # The DaemonSet no longer asks for `privileged: true`, but it is still
    # outside `baseline` three times over: hostPID, hostPath volumes, and the
    # two capabilities it adds. Any one of those is enough for admission to
    # reject it, so Pod Security has to be told at the namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
