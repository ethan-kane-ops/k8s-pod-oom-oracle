# The daemon reads pods to turn a cgroup path into a namespace, pod, and
# container name. That is the whole of its cluster access: read-only, and only
# the objects it correlates against. It never writes to the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oom-oracle
  namespace: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
rules:
  # Correlation, and the whole of it. A kill arrives as a cgroup path carrying a
  # pod UID; resolving it to a name means listing pods and watching for changes.
  #
  # The informer narrows this to one node with a spec.nodeName field selector,
  # but RBAC cannot express that: field selectors are not authorization, so the
  # grant is necessarily cluster-wide on pods. There is deliberately nothing
  # else here. The node name comes from the downward API rather than a nodes
  # read, precisely so this list stays one line long.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oom-oracle
subjects:
  - kind: ServiceAccount
    name: oom-oracle
    namespace: oom-oracle
