# Node agent for oom-oracle.
#
# The privileges below are not incidental, and each one is the minimum for a
# capability the tool would otherwise lose:
#
#   CAP_BPF           creating maps and loading the verified program. Without
#   CAP_PERFMON       it, or without CAP_PERFMON to attach the kprobe, bpf()
#                     returns EPERM and the daemon still runs, falling back to
#                     the poller. Both arrived in 5.8, which is also the floor
#                     for the CO-RE probe, so nothing is lost by requiring them.
#   runAsUser: 0      a non-zero UID starts with an empty *effective* capability
#                     set however large its bounding set is, so the capabilities
#                     above would be present and unusable. A pod spec cannot
#                     request ambient capabilities, which is what would populate
#                     the effective set for a non-root UID, so the daemon runs
#                     as root with almost every capability dropped rather than
#                     as nonroot with capabilities it cannot use.
#   hostPID           /proc must show the node's processes, not the pod's, or
#                     there is no victim to identify and nothing to list.
#
# What is deliberately NOT here is `privileged: true`, which this shipped with
# until the narrower set was measured on kind. privileged grants the full
# capability set plus unrestricted device access, and the daemon writes nothing
# anywhere: it loads one kprobe and reads two read-only mounts.
#
# A separate hazard has no field to set: /proc/<pid>/cgroup is written relative
# to the *reading* process's cgroup namespace, and the CRI puts pods in a
# private one under cgroup v2. A namespaced reader sees
# "0::/../../system.slice/..." which matches nothing under /sys/fs/cgroup. The
# daemon normalises those paths itself rather than depending on a namespace it
# cannot request.
#
# Both host mounts are read-only: the daemon never writes to the node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oom-oracle
  namespace: oom-oracle
  labels:
    app.kubernetes.io/name: oom-oracle
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oom-oracle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oom-oracle
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: oom-oracle
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: oom-oracle
          image: ghcr.io/ethan-kane-ops/k8s-pod-oom-oracle:latest
          imagePullPolicy: IfNotPresent
          args:
            - daemon
            - --detector=auto
            - --cgroup-root=/host/sys/fs/cgroup
            - --proc-root=/host/proc
            - --listen=:9090
            - --log-format=json
          env:
            # The pod informer is scoped to this node with a field selector.
            # Without a node name the daemon would either watch every pod in the
            # cluster or resolve nothing, so it refuses to guess and this is the
            # only supported way to tell it.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # UID 0 with nearly everything dropped, rather than nonroot with
            # capabilities that would not be effective. See the header: a
            # non-zero UID cannot raise a capability into its effective set
            # without ambient capabilities, and a pod spec cannot ask for those.
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                # Load the program and create its maps.
                - BPF
                # Attach the kprobe through perf_event_open. Without this,
                # loading succeeds and attaching is what fails.
                - PERFMON
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # /readyz means the probe is attached and the sampler holds history,
          # not merely that the process started. A pod that OOMs between start
          # and attach would otherwise go unreported with nothing to show why.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
